<!DOCTYPE html>
<html lang="en" class="h-full antialiased scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fahad Khan - Full-Stack Software Engineer ✦ Think it, I'll build it.</title>
  <meta name="description" content="Fahad Khan is a full-stack software engineer building high-concurrency e-commerce systems, real-time event-driven backends, and IoT telemetry architectures." />
  
  <!-- Tailwind CSS via Google static CDN -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('fahad_theme');
        // Strictly default to light mode unless explicitly toggled to dark
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google Fonts matching Abiha's exact typographic stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas: #fffefb;
      --card: #ffffff;
      --card-2: #f7f6f1;
      --ink: #16110e;
      --ink-soft: #5c554e;
      --ink-faint: #9c958d;
      --line: #e9e6df;
      --line-2: #d9d4cb;
      --tool: #0d99ff;
      --tool-soft: #e5f4ff;
      --accent: #ff595e;
      --accent-deep: #e04449;
      --accent-soft: #ffeef0;
      --live: #10b981;
    }


    html.dark {
      --canvas: #090b0e;
      --card: #12161f;
      --card-2: #181d28;
      --ink: #f4f4f5;
      --ink-soft: #a1a1aa;
      --ink-faint: #71717a;
      --line: #222733;
      --line-2: #2d3444;
      --tool: #0d99ff;
      --tool-soft: #102238;
      --accent: #ff595e;
      --accent-deep: #e04449;
      --accent-soft: #2a1618;
      --live: #10b981;
    }

    html.dark .bg-dots {
      background-image: radial-gradient(#f4f4f5 0.75px, transparent 0.75px);
      opacity: 0.12 !important;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    .font-poster {
      font-family: 'Anton', sans-serif;
    }

    .font-mono {
      font-family: 'Space Mono', monospace;
    }

    .hand {
      font-family: 'Shantell Sans', cursive;
    }

    .bg-dots {
      background-image: radial-gradient(#16110e 0.85px, transparent 0.85px);
      background-size: 24px 24px;
    }

    /* Ambient drifting pastel clouds */
    @keyframes cloudDrift {
      0% { transform: translateX(-140%); }
      100% { transform: translateX(100vw); }
    }
    .animate-cloud-1 { animation: cloudDrift 75s linear infinite; }
    .animate-cloud-2 { animation: cloudDrift 95s linear infinite -35s; }
    .animate-cloud-3 { animation: cloudDrift 85s linear infinite -15s; }

    /* Custom marquee */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 25s linear infinite;
    }

    /* Pulse animation */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-blink {
      animation: blink 1.8s infinite ease-in-out;
    }

    /* Equalizer animation in stack card */
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1); }
    }
    .animate-eq-1 { animation: eqBar 1.1s ease-in-out infinite; }
    .animate-eq-2 { animation: eqBar 0.9s ease-in-out infinite 0.2s; }
    .animate-eq-3 { animation: eqBar 1.3s ease-in-out infinite 0.4s; }
    .animate-eq-4 { animation: eqBar 1.0s ease-in-out infinite 0.1s; }
  </style>
</head>
<body class="min-h-full flex flex-col text-[#16110e] dark:text-[#f4f4f5] bg-[#fffefb] dark:bg-[#090b0e] transition-colors duration-300 relative selection:bg-[#ff595e]/20 selection:text-[#ff595e]">

  <!-- BACKGROUND AMBIENT GRADIENT CLOUDS (Exact Abiha aesthetic) -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden opacity-85">
    <div class="absolute inset-0 bg-dots opacity-35"></div>

    <div class="animate-cloud-1 absolute left-0 will-change-transform" style="top: 8%; width: 550px;">
      <svg viewBox="0 0 340 170" class="w-full">
        <defs>
          <radialGradient id="cga-0" cx="50%" cy="34%" r="72%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="55%" stop-color="#ffe6e7" />
            <stop offset="100%" stop-color="#ffb0b3" />
          </radialGradient>
          <filter id="cba-0" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
        </defs>
        <g filter="url(#cba-0)" fill="url(#cga-0)">
          <ellipse cx="170" cy="118" rx="128" ry="30" />
          <circle cx="100" cy="94" r="34" />
          <circle cx="156" cy="70" r="50" />
          <circle cx="214" cy="86" r="40" />
          <circle cx="262" cy="104" r="28" />
        </g>
      </svg>
    </div>

    <div class="animate-cloud-2 absolute left-0 will-change-transform" style="top: 38%; width: 480px;">
      <svg viewBox="0 0 380 140" class="w-full">
</body>
</html>
