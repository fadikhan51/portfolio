<!DOCTYPE html>
<html lang="en" class="h-full antialiased scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fahad Khan - Full-Stack Software Engineer ✦ Think it, I'll build it.</title>
  <meta name="description" content="Fahad Khan is a full-stack software engineer building high-concurrency e-commerce systems, real-time event-driven backends, and IoT telemetry architectures." />
  
  <!-- Tailwind CSS via Google static CDN -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('fahad_theme');
        // Strictly default to light mode unless explicitly toggled to dark
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google Fonts matching Abiha's exact typographic stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --canvas: #fffefb;
      --card: #ffffff;
      --card-2: #f7f6f1;
      --ink: #16110e;
      --ink-soft: #5c554e;
      --ink-faint: #9c958d;
      --line: #e9e6df;
      --line-2: #d9d4cb;
      --tool: #0d99ff;
      --tool-soft: #e5f4ff;
      --accent: #ff595e;
      --accent-deep: #e04449;
      --accent-soft: #ffeef0;
      --live: #10b981;
    }


    html.dark {
      --canvas: #090b0e;
      --card: #12161f;
      --card-2: #181d28;
      --ink: #f4f4f5;
      --ink-soft: #a1a1aa;
      --ink-faint: #71717a;
      --line: #222733;
      --line-2: #2d3444;
      --tool: #0d99ff;
      --tool-soft: #102238;
      --accent: #ff595e;
      --accent-deep: #e04449;
      --accent-soft: #2a1618;
      --live: #10b981;
    }

    html.dark .bg-dots {
      background-image: radial-gradient(#f4f4f5 0.75px, transparent 0.75px);
      opacity: 0.12 !important;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    .font-poster {
      font-family: 'Anton', sans-serif;
    }

    .font-mono {
      font-family: 'Space Mono', monospace;
    }

    .hand {
      font-family: 'Shantell Sans', cursive;
    }

    .bg-dots {
      background-image: radial-gradient(#16110e 0.85px, transparent 0.85px);
      background-size: 24px 24px;
</body>
</html>
